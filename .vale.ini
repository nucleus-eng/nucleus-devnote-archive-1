StylesPath = styles
MinAlertLevel = warning

# Glossary terms are shared across the Nucleus repos; severity is not.
# **Everything warns here.** A DevNote is where new vocabulary enters the
# program, so blocking the source would stop the glossary growing — the same
# rules run at `error` in nucleus-docs, which is a specification corpus.
#
# Exclude build output when running by hand; `_build/` holds three copies of
# every page and will treble any count:
#
#     vale --glob='!**/_build/**' devnotes
[*.md]
BasedOnStyles = glossary

# Known cost, measured 2026-09-21 over all 192 tracked DevNote pages: this line
# hides exactly one true finding out of 81, at devnotes/bac-working-group/main.md:22,
# a bare `vesicle` on a line that carries two markdown links. Removing the line adds
# that finding and adds no false positive on today's corpus. It is kept anyway,
# because it guards against a URL that happens to contain a glossary term and the
# corpus simply has none yet. Revisit if the ratio moves.
TokenIgnores = (\b(?:https?://|www\.)[^\s]+)

glossary.collapses = warning
glossary.narrows = warning
glossary.prefer = warning
glossary.prefer-cased = warning
