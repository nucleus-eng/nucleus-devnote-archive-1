StylesPath = styles
MinAlertLevel = warning

# Glossary terms are shared across the Nucleus repos; severity is not.
# **Everything warns here.** A DevNote is where new vocabulary enters the
# program, so blocking the source would stop the glossary growing — the same
# rules run at `error` in nucleus-docs, which is a specification corpus.
#
# Exclude build output when running by hand; `_build/` holds three copies of
# every page and will treble any count:
#
#     vale --glob='!**/_build/**' devnotes
[*.md]
BasedOnStyles = glossary

# Known cost, re-measured 2026-10-05 over all 197 tracked DevNote pages: this line
# now hides nothing. The one finding it hid when it was measured on 2026-09-21 was a
# bare `vesicle` at devnotes/bac-working-group/main.md:22, on a line carrying two
# markdown links, and that rule is retired. Removing the line changes no count today.
# It is kept because it guards against a URL that happens to contain a glossary term,
# and the corpus simply has none yet. Revisit if the ratio moves.

# A QUOTED SPAN IS EXEMPT FROM EVERY TERMINOLOGY RULE, added 2026-09-21 on Jon's
# ruling, and applied identically in nucleus-docs. A quotation is evidence in this
# program, and rewriting a Node's words to satisfy a linter destroys what the
# quotation was kept for. It is a span rather than a per-rule exception so it covers
# every terminology rule at once, and the next rule too. It covered four rules when it
# was written and covers three now.
#
# Two limits, both measured. Of 1292 quoted lines in the nucleus-docs corpus, 65 carry
# an odd number of quotes: a quotation wrapped across two lines needs both marks on
# one line and is not exempt. And TokenIgnores does not apply to *.yml at all, which
# does not reach this repo today because only *.md is scanned here.
TokenIgnores = (\b(?:https?://|www\.)[^\s]+), ("[^"\n]+"|“[^”\n]+”)

glossary.collapses = warning
glossary.prefer = warning
glossary.prefer-cased = warning

# NO `glossary.narrows`. It refused the bare word "vesicle" and told the author to
# name GUV, SUV or LUV instead. Retired upstream on 2026-10-04, because vesicle is
# the umbrella and two independent axes sit under it: material (liposome,
# polymersome) and size (GUV, SUV, LUV). The generator stopped emitting the file on
# that ruling. This repo was the last one still running the vendored copy, where the
# rule produced 63 of 83 findings by refusing the word the Editor had ruled correct.
